services:
  sorus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sorus:local
    env_file:
      - ./environments/production.env
    environment:
      PORT: "8080"
      DB_PATH: /data/database.db
      UPLOAD_DIR: /data/uploads
      SEARCH_INDEX_DIR: /data/search_index
      ATTACHMENT_DIR: /data/attachments
      BACKUP_DIR: /data/backups
      AUTOCERT_CACHE_DIR: /data/certs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sorus-prod-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 2.0

volumes:
  sorus-prod-data:
