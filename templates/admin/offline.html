{{define "content"}}
<style>
.offline-page{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:3rem 1rem;background:#f8fafc;font-family:system-ui,sans-serif}.offline-card{width:min(100%,42rem);padding:2rem;border:1px solid #e5e7eb;border-radius:1rem;background:white;box-shadow:0 1px 3px #0001;color:#171717}.offline-card h1{font-size:1.5rem;margin:0 0 1rem}.offline-card p{color:#525252;line-height:1.6}.offline-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}.offline-actions a,.offline-actions button{padding:.7rem 1rem;border-radius:.5rem;border:1px solid #d4d4d4;background:white;color:#171717;text-decoration:none;font:inherit;cursor:pointer}.offline-actions button{background:#171717;color:white}
</style>
<main class="offline-page"><section class="offline-card"><h1>{{.T "offline_title"}}</h1><p>{{.T "offline_guidance"}}</p><div class="offline-actions"><button type="button" onclick="window.location.reload()">{{.T "offline_retry"}}</button><a href="#" onclick="history.back();return false">{{.T "offline_back"}}</a></div></section></main>
{{end}}
