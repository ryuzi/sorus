{{define "content"}}{{$d := .Data}}
{{/* 管理画面で権限が無い（403）・ログインしていない（401）画面をブラウザで開いたときの案内（Server.adminDenied）。 */}}
<div class="mx-auto max-w-2xl px-4 py-10">
  <div id="access-denied" class="rounded-xl border border-neutral-200 bg-white p-6 shadow-sm">
    <h1 class="text-xl font-bold text-neutral-900">{{.T "access_denied_title"}}</h1>
    {{with $d.Detail}}<p class="mt-3 text-sm text-neutral-800">{{.}}</p>{{end}}
    <p class="mt-3 text-sm text-neutral-600">{{.T "access_denied_desc"}}</p>
    <a href="/admin" class="btn btn-primary btn-md mt-6">{{.T "access_denied_home"}}</a>
  </div>
</div>
{{end}}
